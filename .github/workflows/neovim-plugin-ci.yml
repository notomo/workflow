name: Neovim plugin CI
on:
  workflow_call:
    inputs:
      test_os:
        description: "`runs-on` on test job"
        required: false
        default: '["ubuntu-latest", "macos-latest", "windows-latest"]'
        type: string
      test_neovim_version:
        description: "`version` given to action-setup-vim on test job"
        required: false
        default: '["nightly"]'
        type: string
  workflow_dispatch:
  push:
    paths:
      - Makefile
      - .github/workflows/neovim-plugin-ci.yml

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(inputs.test_os || '["ubuntu-latest", "macos-latest", "windows-latest"]') }}
        neovim_version: ${{ fromJson(inputs.test_neovim_version || '["nightly"]') }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: rhysd/action-setup-vim@v1.6.1
        id: vim
        with:
          neovim: true
          version: ${{ matrix.neovim_version }}

      - run: make ci
